<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Flavor Tree: сенсорный гид по вкусу пива и сочетаниям с едой</title>
  <base href="/">
  <meta name="description" content="Flavor Tree раскладывает вкус пива на три слоя и подбирает его к блюду. Академия вкуса, паспорт вкуса и меню заведений. Только для лиц старше 21 года.">
  <!-- Сайт об алкогольной продукции: в поисковую выдачу не попадает, вход только после проверки возраста 21+ -->
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Flavor Tree: слушайте вкус">
  <meta property="og:description" content="Подбор пива к блюду, Академия вкуса и паспорт вкуса. 21+">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_KZ">
  <link rel="icon" type="image/png" href="decor/logo.png">
  <!-- interactive-widget: на Android клавиатура сжимает страницу, и поле чата или корзины остаётся над ней -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#FAFAF9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

</body>
</html>
