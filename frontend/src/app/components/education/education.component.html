<section class="section" id="education">
  <div class="container">
    <div class="section-header">
      <span class="badge">Education</span>
      <h2 class="section-title">
        🎓 Beer <span class="highlight">Sommelier</span> School
      </h2>
      <p class="section-subtitle">
        4 learning levels: the Duolingo + Cicerone model
      </p>
    </div>

    <!-- Levels Table -->
    <div class="levels-table">
      <div class="table-header">
        <span class="th">Level</span>
        <span class="th">Title</span>
        <span class="th">What you learn</span>
      </div>
      <div class="table-row" *ngFor="let level of levels">
        <span class="level-dot" [style.background]="level.color"></span>
        <span class="level-name">{{ level.name }}</span>
        <span class="level-desc">{{ level.description }}</span>
      </div>
    </div>

    <!-- Gamification features -->
    <div class="features-bar">
      <span class="feature-tag" *ngFor="let feature of features">{{ feature }}</span>
    </div>
  </div>
</section>
